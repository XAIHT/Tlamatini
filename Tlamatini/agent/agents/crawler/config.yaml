# Models: "@config" follows Config -> Models. Set a concrete value for a per-agent override.
# Crawler Agent Configuration
url: https://example.com

# Optional ADDITIONAL seed URLs crawled with the same settings (in addition to `url`).
# Accepts a YAML list or a comma/space-separated string. Lets a Googler dork hit-list
# (content_mode: links_only) flow straight in via the Parametrizer.
urls: []

system_prompt: Extract all visible text content from this page
content_mode: raw
include_headers: true
# page (default) = analyze exactly the URL(s) above. small-range = the page AND its
# same-site links; medium-range = the page and ALL its links; large-range = recursive
# up to `depth`. include_seed: false restores the old "links only, never the page
# itself" behaviour of the *-range types.
crawl_type: page
include_seed: true
depth: 1

# --- Safety / politeness bounds ---------------------------------------------
max_pages: 25             # hard cap on total pages processed (0 = unlimited)
deadline_seconds: 900     # whole-crawl wall clock: stops cleanly and reports (0 = none)
page_timeout_seconds: 45  # ONE page (connect + download), even from a server that dribbles
max_page_bytes: 8000000   # read at most this much of one page; the rest is cut and logged
request_delay_seconds: 0  # delay between fetches (politeness / rate-limit)
respect_robots: false     # honor robots.txt (skip Disallowed paths; fails open)

# --- Recon extraction --------------------------------------------------------
# When true, scan each page's RAW source for emails, HTML comments, source-map
# references, and likely secrets / API keys; the findings are saved to a
# *_recon.txt file AND prepended to the content sent to the LLM.
extract_recon: false

llm:
  host: http://localhost:11434
  model: "@config"
target_agents: []
source_agents: []
