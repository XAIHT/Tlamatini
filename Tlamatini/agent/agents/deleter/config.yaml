trigger_mode: "immediate"  # "immediate" (delete now) or "event" (delete when a source log shows trigger_event_string)

# WHAT TO DELETE.
#   files_to_delete - the list of files / folders / globs to delete. THIS holds the targets.
#   target_path     - the WORKING DIRECTORY to resolve relative targets against.
#                     e.g. target_path: "<app>/Temp"  +  files_to_delete: ["*.tmp"]
#                     deletes <app>/Temp/*.tmp and NEVER the Temp folder itself.
#                     It is NOT a delete target. If you give ONLY target_path (no
#                     files_to_delete) it is acted on directly for backward
#                     compatibility, but a directory is still refused unless
#                     allow_directory_delete is true.
#                     (Rule 15: scratch lives under the app's own Temp, never C:/Temp or %TEMP%)
# A glob expands; a literal file is removed; a path that does NOT exist is reported as
# "nothing to delete", never an error. Protected app/user-state directories, the working
# directory, git roots and drive roots are ALWAYS refused (with a reason in the log).
# Default is EMPTY so the Deleter only ever deletes exactly what it is told.
target_path: ""
files_to_delete: []

# Delete a whole DIRECTORY tree ONLY when this is true (default false). Deleting a
# folder is a deliberate, stated act -- never a side effect of naming one.
allow_directory_delete: false

recursive: false  # When true, glob patterns also scan subdirectories (injects **/)
filetype_exclusions: ""  # Comma-separated extensions/filenames to spare (e.g. "exe, msi, .profile")
source_agents: []  # event mode: agent logs to watch for trigger_event_string
target_agents: []  # downstream agents to start after deleting
trigger_event_string: "EVENT DETECTED"
poll_interval: 5
