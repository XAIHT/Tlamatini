;
; ESP32TemplateProject — Tlamatini's known-good ESP32 baseline.
;
; This is the reference shape ESP32er's `action: create_project` produces. It is a
; PLAIN PlatformIO project (not a server) — ESP32er drives the `pio` CLI directly,
; so anything `pio` can do to this project, ESP32er can do from chat, and you can
; equally open this folder in VS Code + PlatformIO IDE with nothing else installed.
;
; TO TARGET A DIFFERENT ESP32 VARIANT, change `board` below. Find yours with:
;     pio boards espressif32
; …or from chat: ESP32er with action='boards'. Common choices:
;     esp32dev              generic ESP32 DevKitC / WROOM-32   (LED on GPIO 2)
;     esp32-s3-devkitc-1    ESP32-S3 DevKitC                   (LED on GPIO 48)
;     esp32-c3-devkitm-1    ESP32-C3 DevKitM                   (LED on GPIO 8)
;     lolin32, nodemcu-32s, az-delivery-devkit-v4, …
; If your board's LED is on another pin, change -DBLINK_LED_PIN below to match.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor speed — MUST match the Serial.begin() rate in src/main.cpp,
; or the monitor prints mojibake instead of the log.
monitor_speed = 115200

; ── Compile-time knobs ────────────────────────────────────────────────────
; Changing a build flag here re-compiles the firmware with no source edit —
; this is the intended way to retarget the blink without touching main.cpp.
;   BLINK_LED_PIN     : the GPIO the LED is wired to (GPIO 2 = onboard blue LED
;                       on most DevKitC / WROOM-32 boards).
;   BLINK_INTERVAL_MS : half-period of the blink, in ms (500 ms → 1 Hz).
build_flags =
    -DBLINK_LED_PIN=2
    -DBLINK_INTERVAL_MS=500
