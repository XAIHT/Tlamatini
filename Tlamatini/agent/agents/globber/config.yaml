# Globber Agent Configuration
# Read-only filename pattern search (Claude-Glob equivalent) - find files by glob.
# "*.py" = this folder only; "**/*.py" = every folder below `path`. Brace sets
# ("**/*.{js,py,html}") and lists ("*.py,*.js" | "*.py;*.js" | "*.py|*.js") are
# understood too.
pattern: ""
path: ""
# Result ordering: mtime (newest first, default) | name (alphabetical) | none
sort_by: "mtime"
max_results: 500

# Connection fields
source_agents: []
target_agents: []
