{% load static %}  
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Tlamatini</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="{% static 'agent/img/Tlamatini.ico' %}?v={{ STATIC_VERSION }}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'agent/img/Tlamatini.ico' %}?v={{ STATIC_VERSION }}">
    <link rel="apple-touch-icon" href="{% static 'agent/img/Tlamatini.ico' %}?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="{% static 'agent/vendor/frontend/bootstrap/dist/css/bootstrap.min.css' %}?v={{ STATIC_VERSION }}_offline1">
    <script src="{% static 'agent/vendor/frontend/bootstrap/dist/js/bootstrap.bundle.min.js' %}?v={{ STATIC_VERSION }}_offline1"></script>
    <link rel="stylesheet" href="{% static 'agent/vendor/frontend/highlightjs/styles/atom-one-dark.min.css' %}?v={{ STATIC_VERSION }}_offline1">
    <link rel="stylesheet" href="{% static 'agent/vendor/frontend/nunito/400.css' %}?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="{% static 'agent/vendor/frontend/nunito/700.css' %}?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="{% static 'agent/css/ui_tokens.css' %}?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="{% static 'agent/css/ui_shell.css' %}?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="{% static 'agent/css/entry_pages.css' %}?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="{% static 'agent/css/login.css' %}?v={{ STATIC_VERSION }}">
    <script src="{% static 'agent/js/file_drop_router.js' %}?v={{ STATIC_VERSION }}" data-auth="none"></script>
</head>
<body class="entry-page">
    <main class="container">
        <div class="row login-container">
            <div class="col-md-6 col-lg-4">
                <div class="card login-card">
                    <div class="card-body">
                        <img class="entry-mark" src="{% static 'agent/img/Tlamatini.ico' %}" alt="" width="48" height="48">
                        <h1 class="card-title text-center mb-4 big-white-text">Tlamatini Login</h1>
                        <form method="post">
                            {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                            {% if form.errors %}
                            <div class="login-error-panel" role="alert">
                                {% for error in form.non_field_errors %}
                                <div class="login-error-line">{{ error }}</div>
                                {% endfor %}
                                {% for field in form %}
                                    {% for error in field.errors %}
                                <div class="login-error-line">{{ field.label }}: {{ error }}</div>
                                    {% endfor %}
                                {% endfor %}
                            </div>
                            {% endif %}
                            <div class="mb-3">
                                <label for="id_username" class="form-label white-text">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required id="id_username" value="{{ form.username.value|default_if_none:'' }}">
                            </div>
                            <div class="mb-3">
                                <label for="id_password" class="form-label white-text">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required id="id_password">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary big-white-text-button">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
